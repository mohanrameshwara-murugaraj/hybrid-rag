[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Hybrid (BM25 + dense) RAG over technical documentation with citation verification"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0",
    "rank-bm25>=0.2.2",
    "fastembed>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]  # httpx: FastAPI TestClient
figures = ["matplotlib>=3.8"]
ui = ["streamlit>=1.67", "httpx>=0.27"]  # tested with 1.67

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
